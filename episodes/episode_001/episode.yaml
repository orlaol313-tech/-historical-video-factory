music: {bpm: 100, key: C}

overlays:
  - id: title
    t: [0.3, 3.6]
    lines:
      - {size: 110, text: "Бонни и Оли"}
      - {size: 58,  text: "Серия 1 · Шарик"}

fade_out: [56.8, 59.8]
end_card:
