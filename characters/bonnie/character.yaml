# Бонни — персонаж, переиспользуется во всех сериях
name: Бонни
id: bonnie
role: главная героиня, любопытная и добрая
design:
  style: простые плоские формы, чёрный контур
  body_color: "#F4A6C0"
  accent_color: "#FFD166"
  target_look: |
    Эталон (reference/target_look_duo.png): серо-бежевая пушистая зайчиха,
    длинные уши с розовой внутренней стороной, хохолок на макушке, большие
    голубые глаза с ресницами, румяные щёки, розовый носик; синий джинсовый
    комбинезон с жёлтыми пуговицами. Стиль: мягкий 3D, мех, глубина
    резкости, тёплый лесной свет.
  # Ниже — временная упрощённая 2D-версия, она НЕ равна эталону.
  ears: long   # long = длинные ушки, round = круглые
  height_px: 420
parts: [body, head, eye_l, eye_r, arm_l, arm_r, leg_l, leg_r]
animations: [idle, walk, jump, wave, laugh]
reference_images: [reference/target_look_duo.png]
reference_source: изображение предоставлено пользователем; происхождение и лицензия не проверены, без решения пользователя не публиковать
